[project]
name = "drone-tm"
version = "2026.8.8"
description = "Community-driven drone imagery generation"
authors = [{ name = "HOTOSM", email = "sysadmin@hotosm.org" }]
dependencies = [
  "fastapi==0.112.0",
  "geojson==3.1.0",
  "uvicorn==0.30.5",
  "python-multipart==0.0.9",
  "pydantic[email]==2.8.2",
  "pydantic-settings==2.4.0",
  "geojson-pydantic==1.1.0",
  "shapely==2.1.0",
  "sqlalchemy==2.0.23",
  "geoalchemy2==0.14.2",
  "psycopg[c,pool]==3.2.1",
  "requests==2.32.3",
  "requests-oauthlib==2.0.0",
  "loguru==0.7.2",
  "minio==7.2.0",
  "pillow==12.1.0",
  "pyexiftool==0.5.6",
  "pyjwt==2.8.0",
  "alembic==1.13.1",
  "itsdangerous==2.2.0",
  "Jinja2==3.1.4",
  "gdal==3.10.3",
  "rio-cogeo==5.4.1",
  "aiohttp==3.11.11",
  "aiosmtplib==3.0.1",
  "python-slugify==8.0.4",
  "asgiref==3.8.1",
  "bcrypt==4.2.1",
  "Scrapy==2.14.1",
  "asgi-lifespan==2.1.0",
  "arq==0.26.3",
  "watchfiles==1.1.1",
  "redis==5.2.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "stream-zip==0.0.84",
  "hotosm-auth[fastapi]==0.2.10",
  "geojson-aoi-parser>=0.3.5",
  "drone-flightplan",
  "prometheus-fastapi-instrumentator==7.1.0",
]
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }

[dependency-groups]
dev = ["pre-commit>=4.5.1", "commitizen>=4.13.7", "mypy>=1.13.0"]
test = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "httpx==0.27.2",
  "pyinstrument==5.0.0",
  "coverage==7.6.4",
  "coverage-badge==1.1.2",
]
debug = ["debugpy==1.8.7"]
docs = [
  "mdx-truly-sane-lists>=1.3",
  "mkdocs==1.6.1",
  "mkdocs-drawio==1.13.0",
  "mkdocs-exclude==1.0.2",
  "mkdocs-git-revision-date-localized-plugin==1.5.1",
  "mkdocs-material==9.7.2",
  "mkdocstrings-python==2.0.3",
]
monitoring = [
  #"opentelemetry-sdk==1.27.0",
  #"opentelemetry-api==1.27.0",
  "sentry-sdk[opentelemetry-otlp]==2.53.0",
  "opentelemetry-instrumentation-fastapi==0.60b1",
  "opentelemetry-instrumentation-logging==0.60b1",
  "opentelemetry-instrumentation-psycopg==0.60b1",
  "opentelemetry-instrumentation-requests==0.60b1",
]

[tool.uv.sources]
drone-flightplan = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "2026.8.8"
version_provider = "uv"
version_files = [
  "pyproject.toml:version",
  "app/__version__.py",
  "../frontend/package.json:version",
  "../../chart/Chart.yaml:version",
  "../../chart/Chart.yaml:appVersion",
]
changelog_file = "../../CHANGELOG.md"
update_changelog_on_bump = true
ignored_tag_formats = ["drone-flightplan-$version"]

[tool.codespell]
skip = "*pnpm-lock.yaml,*CHANGELOG.md,src/frontend/src/assets/*,src/frontend/messages/*"
ignore-words-list = "ProjectIn,dateA,te,ALOS,algoritmos,LOD"
write-changes = true

[tool.pytest.ini_options]
markers = ["integration: marks tests that exercise integrated services or workflows"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
exclude = ["app/migrations/", "packages/", "scripts/2026/"]
# Gradual-typing baseline: don't require annotations everywhere yet, but do
# type-check the bodies of unannotated functions so real bugs still surface.
# Tighten (disallow_untyped_defs, etc.) incrementally as coverage improves.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.ruff]
# Preserve the source roots Ruff inferred before this backend-local config existed.
src = ["../..", ".."]

[tool.ruff.lint]
# Was ignore-only, which (with no `select`) falls back to Ruff's minimal
# default rule set (E4/E7/E9/F) - meaning several of the entries below were
# silently inert (their rule families were never actually enabled). This
# select turns bugbear/security/naming/etc. on for real; D (pydocstyle) is
# deliberately left off - restoring it surfaces ~275 pre-existing
# undocumented-* violations, which is a documentation-coverage project of
# its own, not a lint-config fix.
select = ["F", "E4", "E7", "E9", "W", "I", "N", "UP", "ASYNC", "B", "S", "SIM", "BLE"]
# Worker, API, and migration boundaries intentionally catch arbitrary failures
# so they can log, clean up, or translate them into HTTP/task state.
ignore = [
  "ASYNC230",
  "BLE001",
  "S110",
  "S112",
  "SIM117",
  "UP017",
  "UP041",
  # --- Pre-existing debt surfaced by turning `select` on for real. Each is a
  # real, individually-triageable finding, not a false positive - fixing
  # them properly needs per-site review, tracked in todo.md as a follow-up
  # rather than done as a drive-by part of enabling the rule. ---
  "SIM105",  # suppressible-exception (7 sites): stylistic
  # (try/except/pass vs contextlib.suppress), not worth the churn.
  "S105",  # hardcoded-password-string / "S106" hardcoded-password-func-arg
  "S106",  # (5 sites total): false positives - the rule matches on
  # variable/argument *names* containing "password"/"token" (a dev-default
  # POSTGRES_PASSWORD, a `token_url` OAuth endpoint, a `token_type` field),
  # not actual hardcoded secrets. Manually reviewed.
  "N802",  # invalid-function-name (3 sites): PUBLIC_BASE_URL/
  # SCALEODM_WEBHOOK_URL are deliberately SCREAMING_CASE to match the env
  # var naming convention; splitBySquare is legacy camelCase worth renaming
  # separately (has callers to check first).
  "N815",  # mixed-case-variable-in-class-scope (1 site): matches an
  # external webhook payload's JSON casing (statusCode) verbatim.
  "S314",  # suspicious-xml-element-tree-usage (3 sites): parses XML from
  # ScaleODM/S3 (trusted infra, not user-supplied input). Switching to
  # defusedxml is a reasonable follow-up but a new dependency, not a
  # lint-config change.
  "S603",  # subprocess-without-shell-equals-true (1 site): controlled arg
  # list, no shell=True, no untrusted input - reviewed safe as-is.
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI evaluates these factories once while constructing its dependency graph.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# These are retained compatibility modules; renaming them would break imports.
"**/flightPlanWaypointGenerator.py" = ["N999"]
"**/sampleRasterAtPoints.py" = ["N999"]
# S608 (hardcoded-sql-expression): reviewed site-by-site instead of a blanket
# repo-wide ignore, so S608 stays live everywhere else and a new f-string-
# built query elsewhere still gets caught. Each file below only ever
# f-string-interpolates one of: (a) a column name checked against a
# hardcoded allowlist first, (b) a Pydantic model's own field names via
# model_dump().keys() (none of these models allow extra fields, so the key
# set is fixed by the schema, not attacker input), or (c) a choice between
# two fixed SQL-fragment literals, with any actual values always passed as
# %(...)s params. One real value-interpolation site (image_logic.py's
# ST_MakePoint call) was found and fixed to use params instead, rather than
# ignored.
"app/projects/project_routes.py" = ["S608"]
"app/projects/project_logic.py" = ["S608"]
"app/projects/project_schemas.py" = ["S608"]
"app/arq/cloudnative.py" = ["S608"]
"app/arq/tasks.py" = ["S608"]
"app/drones/drone_schemas.py" = ["S608"]
"app/images/image_logic.py" = ["S608"]
"app/images/flight_stationary_removal.py" = ["S608"]
"app/images/flight_tail_removal.py" = ["S608"]
"app/users/user_schemas.py" = ["S608"]
"tests/test_classification_routes.py" = ["S608"]
# These fixtures model naive PostgreSQL timestamp values returned by psycopg.
"tests/test_project_processing.py" = ["DTZ001"]
# This test deliberately passes a naive datetime to exercise input validation.
"tests/test_solar_position.py" = ["DTZ001"]
