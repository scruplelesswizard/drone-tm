name: Frontend CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/frontend/**"
      - "src/pnpm-workspace.yaml"
      - "src/pnpm-lock.yaml"
      - ".github/workflows/frontend-test.yml"
      - ".github/scripts/check-component-tests.sh"

  pull_request:
    paths:
      - "src/frontend/**"
      - "src/pnpm-workspace.yaml"
      - "src/pnpm-lock.yaml"
      - ".github/workflows/frontend-test.yml"
      - ".github/scripts/check-component-tests.sh"

  # Allow manual trigger (workflow_dispatch)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: src

      # Compiles message catalogs to src/paraglide (gitignored). Not an
      # npm-style `pretest` hook - it's literally named "prebuild" (for
      # `vite build`) and vitest doesn't invoke it, so any test importing
      # from @/paraglide/messages would otherwise fail on a fresh checkout.
      - run: pnpm run prebuild
        working-directory: src/frontend

      - run: pnpm run test
        working-directory: src/frontend

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: src

      # gcp-editor is a workspace-linked sibling package the frontend
      # imports from its build output, not its source - must be built
      # first (matches frontend/Dockerfile's build stage).
      - run: pnpm run build
        working-directory: src/gcp-editor

      # `build` runs `tsc && vite build` - typecheck and production build
      # in one gate, previously only ever exercised inside the release
      # Docker image.
      - run: pnpm run build
        working-directory: src/frontend

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: src

      - run: pnpm run prebuild
        working-directory: src/frontend

      # Blocking: the ~6600 pre-existing violations surfaced by the ESLint
      # v9 migration (tracked in todo.md) have been fully triaged to zero,
      # so this is now a normal gate like `test`/`build`.
      - run: ./node_modules/.bin/eslint .
        working-directory: src/frontend

  # Governance: a PR that adds a new component must also add a sibling test
  # file. PR-only (needs github.base_ref, which push events don't have).
  require-component-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/check-component-tests.sh "${{ github.base_ref }}"
