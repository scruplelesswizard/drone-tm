{{/*
Default-deny NetworkPolicy, disabled by default (networkPolicy.enabled:
false in values.yaml). This is a starting point for a deploy-owner with a
real cluster to validate against, not a verified-safe default - see the
comment on networkPolicy in values.yaml for why it isn't force-enabled.

Baseline: deny all ingress/egress for every pod this chart manages, then
punch narrow holes for what's actually needed:
  - DNS (every pod needs this to resolve anything)
  - intra-release pod-to-pod traffic (backend <-> worker <-> dragonfly <->
    qgis <-> postgresql, all selected by the shared release label)
  - HTTPS egress for external dependencies (S3, SMTP, ScaleODM, Hanko SSO,
    Google OAuth, Sentry) - allowed broadly rather than enumerated, since
    most of those are third-party endpoints outside this chart's control
  - ingress to the backend's HTTP port from anywhere (the ingress
    controller fronts it; its own namespace/labels vary too much across
    clusters to hardcode a narrower source here)
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "drone-tm.fullname" . }}-default-deny
  labels:
    {{- include "drone-tm.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "drone-tm.fullname" . }}-allow-dns
  labels:
    {{- include "drone-tm.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "drone-tm.fullname" . }}-allow-intra-release
  labels:
    {{- include "drone-tm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "drone-tm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "drone-tm.selectorLabels" . | nindent 14 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "drone-tm.selectorLabels" . | nindent 14 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "drone-tm.fullname" . }}-allow-https-egress
  labels:
    {{- include "drone-tm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "drone-tm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "drone-tm.fullname" . }}-allow-ingress-to-backend
  labels:
    {{- include "drone-tm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "drone-tm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.port }}
{{- end }}
